      <text x="65" y="24" fill="#1b6ec2" font-size="11" font-weight="700" text-anchor="middle">GÈNE 1</text>
      <text x="65" y="46" fill="#1b1f27" font-size="12" text-anchor="middle">Conteneur #17</text>
      <text x="65" y="70" fill="#5b6472" font-size="10" text-anchor="middle">Vivacité: 0.41</text>
      <text x="65" y="86" fill="#5b6472" font-size="10" text-anchor="middle">Potentiel: 1120</text>
    </g>
    <g transform="translate(165,20)">
