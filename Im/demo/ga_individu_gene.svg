  <path d="M660,280 L660,330" stroke="#2ea44f" stroke-width="2" fill="none" marker-end="url(#arrowGreen2L)"/>

  <g transform="translate(360,335)">
    <rect x="0" y="0" width="600" height="110" rx="14" fill="#eafaf0" stroke="#9adcb2" stroke-width="1.5"/>
    <text x="20" y="28" fill="#1b7a3d" font-size="13" font-weight="700">Score de fitness de l'individu</text>
    <text x="20" y="50" fill="#2f6d47" font-size="11">écart-type(Vivacité) et écart-type(Potentiel) après mélange simulé</text>
    <text x="20" y="68" fill="#2f6d47" font-size="11">+ bonus de proximité à la cible  −  pénalité si trop de mélanges</text>
    <text x="20" y="86" fill="#2f6d47" font-size="11">→ combinaisons avec doublons rejetées (score nul)</text>
