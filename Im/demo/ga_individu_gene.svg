  <text x="40" y="378" fill="#8a94a3" font-size="11">chaque case = un individu (une combinaison candidate)</text>

  <path d="M170,158 C260,158 260,190 330,190" stroke="#1b6ec2" stroke-width="1.8" fill="none" stroke-dasharray="3 3" marker-end="url(#arrow2L)"/>

  <text x="360" y="112" fill="#5b6472" font-size="12" font-weight="600">Un individu = 4 gènes (conteneurs)</text>
  <g transform="translate(360,130)">
    <rect x="0" y="0" width="600" height="150" rx="14" fill="#f6f8fa" stroke="#1b6ec2" stroke-width="1.5"/>

