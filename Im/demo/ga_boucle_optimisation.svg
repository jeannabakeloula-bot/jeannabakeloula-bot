<svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowL" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b6ec2"/>
    </marker>
    <marker id="arrowMutedL" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a94a3"/>
    </marker>
    <marker id="arrowGreenL" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2ea44f"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>

  <text x="40" y="48" fill="#1b1f27" font-size="22" font-weight="700">Boucle d'optimisation — Algorithme génétique</text>
  <text x="40" y="72" fill="#5b6472" font-size="13">Homogénéisation de conteneurs de poudre selon vivacité &amp; potentiel</text>

  <!-- Step boxes -->
  <g>
    <rect x="40" y="120" width="170" height="110" rx="12" fill="#f6f8fa" stroke="#d7dde4" stroke-width="1.5"/>
    <text x="125" y="150" fill="#1b6ec2" font-size="12" font-weight="700" text-anchor="middle">01</text>
    <text x="125" y="172" fill="#1b1f27" font-size="14" font-weight="600" text-anchor="middle">Population initiale</text>
    <text x="125" y="192" fill="#5b6472" font-size="11" text-anchor="middle">64 individus</text>
    <text x="125" y="208" fill="#5b6472" font-size="11" text-anchor="middle">combinaisons de 4</text>
    <text x="125" y="222" fill="#5b6472" font-size="11" text-anchor="middle">conteneurs (aléatoire)</text>
  </g>

  <g>
    <rect x="270" y="120" width="170" height="110" rx="12" fill="#f6f8fa" stroke="#d7dde4" stroke-width="1.5"/>
    <text x="355" y="150" fill="#1b6ec2" font-size="12" font-weight="700" text-anchor="middle">02</text>
    <text x="355" y="172" fill="#1b1f27" font-size="14" font-weight="600" text-anchor="middle">Évaluation</text>
    <text x="355" y="192" fill="#5b6472" font-size="11" text-anchor="middle">fonction de fitness</text>
    <text x="355" y="208" fill="#5b6472" font-size="11" text-anchor="middle">score = f(écart-type</text>
    <text x="355" y="222" fill="#5b6472" font-size="11" text-anchor="middle">vivacité, potentiel)</text>
  </g>

  <g>
    <rect x="500" y="120" width="170" height="110" rx="12" fill="#f6f8fa" stroke="#d7dde4" stroke-width="1.5"/>
    <text x="585" y="150" fill="#1b6ec2" font-size="12" font-weight="700" text-anchor="middle">03</text>
    <text x="585" y="172" fill="#1b1f27" font-size="14" font-weight="600" text-anchor="middle">Sélection</text>
    <text x="585" y="192" fill="#5b6472" font-size="11" text-anchor="middle">meilleurs individus</text>
    <text x="585" y="208" fill="#5b6472" font-size="11" text-anchor="middle">retenus selon</text>
    <text x="585" y="222" fill="#5b6472" font-size="11" text-anchor="middle">leur score</text>
  </g>

  <g>
    <rect x="730" y="120" width="230" height="110" rx="12" fill="#f6f8fa" stroke="#d7dde4" stroke-width="1.5"/>
    <text x="845" y="150" fill="#1b6ec2" font-size="12" font-weight="700" text-anchor="middle">04</text>
    <text x="845" y="172" fill="#1b1f27" font-size="14" font-weight="600" text-anchor="middle">Croisement + Mutation</text>
    <text x="845" y="192" fill="#5b6472" font-size="11" text-anchor="middle">recombinaison de solutions</text>
    <text x="845" y="208" fill="#5b6472" font-size="11" text-anchor="middle">mutation aléatoire</text>
    <text x="845" y="222" fill="#5b6472" font-size="11" text-anchor="middle">25% des gènes</text>
  </g>

  <path d="M210,175 L268,175" stroke="#1b6ec2" stroke-width="2" fill="none" marker-end="url(#arrowL)"/>
  <path d="M440,175 L498,175" stroke="#1b6ec2" stroke-width="2" fill="none" marker-end="url(#arrowL)"/>
  <path d="M670,175 L728,175" stroke="#1b6ec2" stroke-width="2" fill="none" marker-end="url(#arrowL)"/>

  <path d="M845,232 C845,300 355,300 355,232" stroke="#8a94a3" stroke-width="1.8" fill="none" stroke-dasharray="4 4" marker-end="url(#arrowMutedL)"/>
  <text x="600" y="292" fill="#5b6472" font-size="12" text-anchor="middle">nouvelle génération — répété jusqu'à 100 itérations</text>

  <g>
    <rect x="330" y="380" width="340" height="90" rx="12" fill="#eafaf0" stroke="#9adcb2" stroke-width="1.5"/>
    <text x="500" y="412" fill="#1b7a3d" font-size="14" font-weight="700" text-anchor="middle">Cible atteinte</text>
    <text x="500" y="434" fill="#2f6d47" font-size="11" text-anchor="middle">écart-type minimal (ex. potentiel &lt; 0.25, vivacité &lt; 0.03)</text>
    <text x="500" y="452" fill="#2f6d47" font-size="11" text-anchor="middle">→ meilleur individu conservé</text>
  </g>

  <path d="M355,230 C355,330 500,330 500,378" stroke="#2ea44f" stroke-width="2" fill="none" marker-end="url(#arrowGreenL)"/>

  <g>
    <rect x="60" y="380" width="230" height="90" rx="12" fill="#f6f8fa" stroke="#d7dde4" stroke-width="1.5"/>
    <text x="175" y="412" fill="#1b1f27" font-size="14" font-weight="600" text-anchor="middle">Simulation du mélange</text>
    <text x="175" y="432" fill="#5b6472" font-size="11" text-anchor="middle">calcul des propriétés</text>
    <text x="175" y="448" fill="#5b6472" font-size="11" text-anchor="middle">théoriques post-mélange</text>
  </g>
  <path d="M330,425 L288,425" stroke="#2ea44f" stroke-width="2" fill="none" marker-end="url(#arrowGreenL)"/>

  <g>
    <rect x="710" y="380" width="250" height="90" rx="12" fill="#f6f8fa" stroke="#d7dde4" stroke-width="1.5"/>
    <text x="835" y="412" fill="#1b1f27" font-size="14" font-weight="600" text-anchor="middle">Mise à jour du jeu de données</text>
    <text x="835" y="432" fill="#5b6472" font-size="11" text-anchor="middle">nouveaux écarts-types</text>
    <text x="835" y="448" fill="#5b6472" font-size="11" text-anchor="middle">recalculés pour itération suivante</text>
  </g>
  <path d="M670,425 L708,425" stroke="#2ea44f" stroke-width="2" fill="none" marker-end="url(#arrowGreenL)"/>

  <text x="500" y="530" fill="#8a94a3" font-size="11" text-anchor="middle">Implémentation : pygad.GA — population = 64, generations = 100, mutation_percent_genes = 25</text>
</svg>
