<svg viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow3L" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b6ec2"/>
    </marker>
    <marker id="arrowGreen3L" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2ea44f"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>

  <text x="40" y="46" fill="#1b1f27" font-size="22" font-weight="700">Architecture applicative — API Sélecteur de Partiels</text>
  <text x="40" y="70" fill="#5b6472" font-size="13">FastAPI + Gradio + moteur d'algorithme génétique (PyGAD)</text>

  <text x="40" y="112" fill="#8a94a3" font-size="11" font-weight="700" letter-spacing="1">01 · SOURCES DE DONNÉES</text>
  <g transform="translate(40,124)">
    <rect width="200" height="70" rx="10" fill="#f6f8fa" stroke="#d7dde4"/>
    <text x="100" y="30" fill="#1b1f27" font-size="13" font-weight="600" text-anchor="middle">Fichier CSV</text>
    <text x="100" y="50" fill="#5b6472" font-size="10" text-anchor="middle">Conteneur / Vivacité / Potentiel</text>
  </g>
  <g transform="translate(260,124)">
    <rect width="200" height="70" rx="10" fill="#f6f8fa" stroke="#d7dde4"/>
    <text x="100" y="30" fill="#1b1f27" font-size="13" font-weight="600" text-anchor="middle">Fichier JSON (MES)</text>
    <text x="100" y="50" fill="#5b6472" font-size="10" text-anchor="middle">extraction par Partiels</text>
  </g>

  <path d="M140,194 L140,224" stroke="#1b6ec2" stroke-width="2" fill="none" marker-end="url(#arrow3L)"/>
  <path d="M360,194 L360,224" stroke="#1b6ec2" stroke-width="2" fill="none" marker-end="url(#arrow3L)"/>

  <text x="40" y="222" fill="#8a94a3" font-size="11" font-weight="700" letter-spacing="1">02 · COUCHE API — FASTAPI</text>
  <g transform="translate(40,234)">
    <rect width="420" height="130" rx="12" fill="#f6f8fa" stroke="#d7dde4" stroke-width="1.5"/>
    <text x="20" y="26" fill="#1b6ec2" font-size="12" font-weight="700">Endpoints</text>
    <text x="20" y="50" fill="#2b303a" font-size="11">POST /view_csv/ · /view_json/  — prévisualisation</text>
    <text x="20" y="72" fill="#2b303a" font-size="11">POST /run-ag-csv/  — lance l'AG depuis un CSV</text>
    <text x="20" y="94" fill="#2b303a" font-size="11">POST /run-ag-json/  — lance l'AG depuis un JSON MES</text>
    <text x="20" y="116" fill="#5b6472" font-size="10">paramètres : score cible, nb chemins, pondérations</text>
  </g>

  <g transform="translate(500,124)">
    <rect width="220" height="110" rx="12" fill="#f6f8fa" stroke="#1b6ec2" stroke-width="1.5"/>
    <text x="110" y="30" fill="#1b6ec2" font-size="12" font-weight="700" text-anchor="middle">Librairie de mélange</text>
    <text x="110" y="52" fill="#2b303a" font-size="10" text-anchor="middle">lois de mélange modulaires</text>
    <text x="110" y="70" fill="#2b303a" font-size="10" text-anchor="middle">(défaut : moyenne linéaire)</text>
    <text x="110" y="90" fill="#5b6472" font-size="10" text-anchor="middle">simule le mélange réel</text>
  </g>

  <g transform="translate(740,124)">
    <rect width="220" height="110" rx="12" fill="#f6f8fa" stroke="#1b6ec2" stroke-width="1.5"/>
    <text x="110" y="30" fill="#1b6ec2" font-size="12" font-weight="700" text-anchor="middle">Moteur AG — PyGAD</text>
    <text x="110" y="52" fill="#2b303a" font-size="10" text-anchor="middle">population 64 · 100 générations</text>
    <text x="110" y="70" fill="#2b303a" font-size="10" text-anchor="middle">mutation 25% · sans doublons</text>
    <text x="110" y="90" fill="#5b6472" font-size="10" text-anchor="middle">minimise l'écart-type global</text>
  </g>

  <path d="M460,265 C480,265 480,180 498,180" stroke="#1b6ec2" stroke-width="2" fill="none" marker-end="url(#arrow3L)"/>
  <path d="M720,179 L738,179" stroke="#1b6ec2" stroke-width="2" fill="none" marker-end="url(#arrow3L)"/>

  <text x="40" y="400" fill="#8a94a3" font-size="11" font-weight="700" letter-spacing="1">03 · INTERFACE — GRADIO</text>
  <g transform="translate(40,412)">
    <rect width="440" height="110" rx="12" fill="#f6f8fa" stroke="#d7dde4" stroke-width="1.5"/>
    <text x="20" y="30" fill="#1b1f27" font-size="13" font-weight="600">Mode utilisateur</text>
    <text x="20" y="52" fill="#5b6472" font-size="10">chargement du fichier → paramètres par défaut</text>
    <text x="20" y="70" fill="#5b6472" font-size="10">verrouillés et optimisés</text>
    <text x="20" y="92" fill="#5b6472" font-size="10">→ résultat en un clic</text>
  </g>
  <g transform="translate(500,412)">
    <rect width="440" height="110" rx="12" fill="#f6f8fa" stroke="#d7dde4" stroke-width="1.5"/>
    <text x="20" y="30" fill="#1b1f27" font-size="13" font-weight="600">Mode expert</text>
    <text x="20" y="52" fill="#5b6472" font-size="10">score cible, nb d'étapes max,</text>
    <text x="20" y="70" fill="#5b6472" font-size="10">nb de chemins proposés,</text>
    <text x="20" y="92" fill="#5b6472" font-size="10">pondération vivacité / potentiel</text>
  </g>

  <path d="M260,364 L260,410" stroke="#1b6ec2" stroke-width="2" fill="none" marker-end="url(#arrow3L)"/>
  <path d="M720,364 L720,410" stroke="#1b6ec2" stroke-width="2" fill="none" marker-end="url(#arrow3L)"/>

  <text x="40" y="558" fill="#8a94a3" font-size="11" font-weight="700" letter-spacing="1">04 · SORTIES</text>
  <g transform="translate(40,568)">
    <rect width="440" height="40" rx="10" fill="#eafaf0" stroke="#9adcb2"/>
    <text x="220" y="26" fill="#1b7a3d" font-size="11" text-anchor="middle">Archive JSON technique (horodatée) — API/results/</text>
  </g>
  <g transform="translate(500,568)">
    <rect width="440" height="40" rx="10" fill="#eafaf0" stroke="#9adcb2"/>
    <text x="220" y="26" fill="#1b7a3d" font-size="11" text-anchor="middle">Rapport explicatif Markdown — results/</text>
  </g>
  <path d="M260,522 L260,566" stroke="#2ea44f" stroke-width="2" fill="none" marker-end="url(#arrowGreen3L)"/>
  <path d="M720,522 L720,566" stroke="#2ea44f" stroke-width="2" fill="none" marker-end="url(#arrowGreen3L)"/>
</svg>
